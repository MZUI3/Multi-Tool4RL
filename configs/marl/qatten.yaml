# Qatten (Yang et al., 2020) - attention-weighted monotonic mixing
algo: qatten
seed: 0
env:
  id: spread
  kwargs:
    n_agents: 3
train:
  total_steps: 200000
  log_interval: 5000
  eval_interval: 25000
  eval_episodes: 10
hparams:
  lr: 5.0e-4
  buffer_size: 50000
  batch_size: 256
  learning_starts: 2000
  train_freq: 10
  target_update_interval: 200
  eps_decay_steps: 50000
  attention_heads: 4
  mixer_embed_dim: 32
  hidden_sizes: [64, 64]
