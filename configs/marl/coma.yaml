# COMA - counterfactual multi-agent policy gradients (Foerster et al., 2018)
algo: coma
seed: 0
device: auto
env:
  id: spread          # spread | predator_prey | matrix_game | pz:<module> | smac:<map>
  kwargs:
    n_agents: 3
  num_envs: 8
train:
  total_steps: 300000
  log_interval: 5000
  eval_interval: 25000
  eval_episodes: 10
hparams:
  lr: 5.0e-4
  critic_lr: 5.0e-4
  gamma: 0.99
  n_steps: 25
  td_lambda: 0.8
  ent_coef: 0.01
  critic_epochs: 10
  normalize_advantage: true
  target_update_interval: 20
  hidden_sizes: [64, 64]
  critic_hidden: [128, 128]
