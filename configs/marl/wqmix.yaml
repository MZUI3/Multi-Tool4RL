# Weighted QMIX (OW/CW) - (Rashid et al., 2020)
algo: wqmix
seed: 0
device: auto
env:
  id: spread          # spread | predator_prey | matrix_game | pz:<module> | smac:<map>
  kwargs:
    n_agents: 3
  num_envs: 1
train:
  total_steps: 200000
  log_interval: 5000
  eval_interval: 25000
  eval_episodes: 10
hparams:
  lr: 5.0e-4
  gamma: 0.99
  buffer_size: 50000
  batch_size: 64
  learning_starts: 2000
  train_freq: 1
  target_update_interval: 200
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 50000
  double_q: true
  hidden_sizes: [64, 64]
  agent_id: true
  mixer_embed_dim: 32
  hypernet_embed: 64
  weighting: ow        # ow | cw
  w_alpha: 0.1
  central_mixer_hidden: [128, 128]
  central_loss_coef: 1.0
