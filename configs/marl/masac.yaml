# MASAC - multi-agent soft actor-critic (discrete), centralized per-agent critics
algo: masac
seed: 0
env:
  id: spread
  kwargs:
    n_agents: 3
train:
  total_steps: 200000
  log_interval: 5000
  eval_interval: 25000
  eval_episodes: 10
hparams:
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  alpha: 0.05
  batch_size: 128
  buffer_size: 100000
  learning_starts: 2000
  hidden_sizes: [64, 64]
