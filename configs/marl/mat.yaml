# MAT - Multi-Agent Transformer (Wen et al., 2022)
algo: mat
seed: 0
device: auto
env:
  id: spread          # spread | predator_prey | matrix_game | pz:<module> | smac:<map>
  kwargs:
    n_agents: 3
  num_envs: 8
train:
  total_steps: 300000
  log_interval: 5000
  eval_interval: 25000
  eval_episodes: 10
hparams:
  lr: 5.0e-4
  gamma: 0.99
  n_steps: 50
  gae_lambda: 0.95
  clip_range: 0.2
  n_epochs: 5
  n_minibatches: 2
  ent_coef: 0.01
  vf_coef: 1.0
  embed_dim: 64
  n_heads: 2
  n_blocks: 1
