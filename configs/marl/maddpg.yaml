# MADDPG with Gumbel-Softmax for discrete actions (Lowe et al., 2017)
algo: maddpg
seed: 0
device: auto
env:
  id: spread          # spread | predator_prey | matrix_game | pz:<module> | smac:<map>
  kwargs:
    n_agents: 3
  num_envs: 1
train:
  total_steps: 200000
  log_interval: 5000
  eval_interval: 25000
  eval_episodes: 10
hparams:
  actor_lr: 5.0e-4
  critic_lr: 1.0e-3
  gamma: 0.95
  tau: 0.01
  batch_size: 256
  buffer_size: 100000
  learning_starts: 2000
  gumbel_temperature: 1.0
  policy_reg: 1.0e-3
  hidden_sizes: [64, 64]
  critic_hidden: [128, 128]
