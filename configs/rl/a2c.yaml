# A2C (synchronous advantage actor-critic)
algo: a2c
seed: 0
env:
  id: CartPole-v1
  num_envs: 8
train:
  total_steps: 100000
  eval_interval: 20000
hparams:
  lr: 7.0e-4
  n_steps: 5
  gamma: 0.99
  gae_lambda: 1.0
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden_sizes: [64, 64]
  activation: tanh
