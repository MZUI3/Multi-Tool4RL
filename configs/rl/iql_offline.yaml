# Implicit Q-Learning (Kostrikov et al., 2022) - offline
algo: iql_offline
seed: 0
env:
  id: CartPole-v1
dataset: auto
dataset_steps: 20000
train:
  total_steps: 10000
  log_interval: 1000
  eval_interval: 2000
hparams:
  expectile: 0.7
  beta: 3.0
  batch_size: 256
  lr: 3.0e-4
  hidden_sizes: [256, 256]
