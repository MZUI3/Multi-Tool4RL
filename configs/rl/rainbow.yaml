# Rainbow (Hessel et al., 2018): C51 + Double + Dueling + NoisyNet + PER + n-step
# Every ingredient can be switched off here to run ablations.
algo: rainbow
seed: 0
env:
  id: CartPole-v1
train:
  total_steps: 50000
  eval_interval: 10000
hparams:
  lr: 5.0e-4
  buffer_size: 50000
  batch_size: 64
  learning_starts: 1000
  target_update_interval: 500
  hidden_sizes: [128, 128]
  atoms: 51
  v_min: 0.0
  v_max: 100.0
  double: true
  dueling: true
  noisy: true
  noisy_sigma: 0.5
  prioritized: true
  per_alpha: 0.5
  per_beta_start: 0.4
  n_step: 3
  eps_start: 0.0
  eps_end: 0.0
