# Decision Transformer (Chen et al., 2021) - offline sequence modelling; conditioned on target_return at test time
algo: dt
seed: 0
env:
  id: CartPole-v1
dataset: auto
dataset_steps: 20000
train:
  total_steps: 5000
  log_interval: 500
  eval_interval: 1000
hparams:
  context: 20
  embed: 128
  n_layers: 3
  n_heads: 1
  lr: 1.0e-4
  batch_size: 64
  target_return: null   # null = best return in the dataset
