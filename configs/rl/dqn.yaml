# DQN (Mnih et al., 2015)
algo: dqn
seed: 0
device: auto
env:
  id: CartPole-v1
  num_envs: 1
train:
  total_steps: 50000
  log_interval: 2000
  eval_interval: 10000
  eval_episodes: 5
hparams:
  lr: 1.0e-3
  gamma: 0.99
  buffer_size: 50000
  batch_size: 64
  learning_starts: 1000
  train_freq: 1
  gradient_steps: 1
  target_update_interval: 500
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 10000
  hidden_sizes: [128, 128]
  activation: relu
