# TRPO (Schulman et al., 2015)
algo: trpo
seed: 0
env:
  id: CartPole-v1
  num_envs: 4
train:
  total_steps: 100000
  eval_interval: 20000
hparams:
  n_steps: 512
  gamma: 0.99
  gae_lambda: 0.95
  max_kl: 0.01
  damping: 0.1
  cg_iters: 10
  vf_lr: 1.0e-3
  vf_iters: 5
  hidden_sizes: [64, 64]
  activation: tanh
